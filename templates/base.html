<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Assessment | Find Your Ideal Career</title>
<meta name="description" content="Discover your ideal career through a comprehensive assessment of interests, strengths, personality, and values. Matched against 174 careers.">
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6018524927950587" crossorigin="anonymous"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="header-left">
    <form method="post" action="/set-lang" id="lang-form">
      <select name="lang" class="lang-dropdown" onchange="document.getElementById('lang-form').submit()">
        <option value="ko" {% if lang == 'ko' %}selected{% endif %}>🇰🇷 한국어</option>
        <option value="en" {% if lang == 'en' %}selected{% endif %}>🇺🇸 English</option>
        <option value="zh" {% if lang == 'zh' %}selected{% endif %}>🇨🇳 中文</option>
      </select>
    </form>
  </div>
  <a href="/" class="logo">Career Assessment</a>
  <div style="width:120px;"></div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<!-- AdSense Banner Bottom -->
<div class="ad-banner">
  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6018524927950587"
       data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<footer class="site-footer">
  <p>&copy; 2024 Career Assessment | Multi-Theory Ensemble (MTECA)</p>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
