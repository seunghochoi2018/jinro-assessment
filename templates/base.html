<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진로 탐색 시스템 | Career Assessment</title>
<!-- Google AdSense -->
<!-- ADSENSE_SCRIPT_PLACEHOLDER -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXX" crossorigin="anonymous"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="header-left">
    <form method="post" action="/set-lang" id="lang-form">
      <select name="lang" class="lang-dropdown" onchange="document.getElementById('lang-form').submit()">
        {% for code, cfg in LANG_CONFIG.items() %}
        <option value="{{ code }}" {% if lang == code %}selected{% endif %}>{{ cfg.flag }} {{ cfg.name }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
  <a href="/" class="logo">Career Assessment</a>
  <div style="width:120px;"></div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<!-- AdSense Banner Bottom -->
<div class="ad-banner">
  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX"
       data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<footer class="site-footer">
  <p>진로 탐색 시스템 &copy; 2024 | Multi-Theory Ensemble Career Assessment</p>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
